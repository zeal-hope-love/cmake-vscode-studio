<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>安装 CV Studio</title>
    <style>
      /* ---------------------------------------------------------------------
         安装界面样式。
         
         用 Chromium 渲染，所以字体、圆角、渐变、阴影都是高清的 ——
         这正是替换 NSIS 的理由（那个是点阵化的 Win32 对话框）。
         --------------------------------------------------------------------- */
      :root {
        --bg: #0d1117;
        --bg-raised: #161b22;
        --border: #30363d;
        --fg: #e6edf3;
        --fg-muted: #8b949e;
        --accent: #4f8ef7;
        --accent-2: #7c5cff;
        --ok: #3fb950;
        --err: #f85149;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family:
          'Segoe UI Variable Display', 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC',
          system-ui, sans-serif;
        font-size: 14px;
        /* 全局抗锯齿，字看起来更细更清晰 */
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        user-select: none;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* ---- 顶部品牌区 ---- */
      .hero {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 22px 28px 18px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(135deg, rgba(79, 142, 247, 0.14), rgba(124, 92, 255, 0.08));
      }

      /* 图标用 SVG 直接画，不用位图 —— 任何 DPI 下都清晰 */
      .logo {
        width: 56px;
        height: 56px;
        flex: 0 0 auto;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 18px rgba(79, 142, 247, 0.32);
      }

      .hero h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }

      .hero p {
        margin: 5px 0 0;
        font-size: 13px;
        color: var(--fg-muted);
      }

      .ver {
        margin-left: auto;
        font-size: 12px;
        color: var(--fg-muted);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 3px 12px;
      }

      /* ---- 主体 ---- */
      .body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 22px 28px;
      }

      .step {
        margin-bottom: 20px;
      }

      .step__label {
        font-size: 12px;
        color: var(--fg-muted);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      input[type='text'] {
        flex: 1;
        min-width: 0;
        height: 38px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg-raised);
        color: var(--fg);
        font-size: 13px;
        font-family: inherit;
        user-select: text;
      }

      input[type='text']:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(79, 142, 247, 0.18);
      }

      button {
        height: 38px;
        padding: 0 18px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg-raised);
        color: var(--fg);
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.16s ease;
        white-space: nowrap;
      }

      button:hover:not(:disabled) {
        border-color: #484f58;
        background: #1c2128;
      }

      button.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-color: transparent;
        font-weight: 600;
        box-shadow: 0 4px 14px rgba(79, 142, 247, 0.28);
      }

      button.primary:hover:not(:disabled) {
        filter: brightness(1.08);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .checks {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      label.check {
        display: flex;
        align-items: center;
        gap: 9px;
        cursor: pointer;
        font-size: 13px;
        color: var(--fg);
      }

      label.check input {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      /* ---- 进度区 ---- */
      .progress-wrap {
        display: none;
      }

      .progress-wrap.on {
        display: block;
      }

      .bar {
        height: 8px;
        border-radius: 99px;
        background: #21262d;
        overflow: hidden;
        margin: 10px 0;
      }

      .bar__fill {
        height: 100%;
        width: 0;
        border-radius: 99px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width 0.15s linear;
      }

      /* 不确定进度时的流动条纹（清理旧版本那种瞬间阶段） */
      .bar__fill.indet {
        width: 35% !important;
        animation: slide 1.1s ease-in-out infinite;
      }

      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(360%);
        }
      }

      .progress-info {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--fg-muted);
      }

      .current-file {
        margin-top: 8px;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 11.5px;
        color: #6e7681;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        direction: rtl;
        text-align: left;
        height: 16px;
      }

      /* ---- 完成 / 失败 ---- */
      .result {
        display: none;
        text-align: center;
        padding: 26px 0 10px;
      }

      .result.on {
        display: block;
      }

      .result__icon {
        width: 60px;
        height: 60px;
        margin: 0 auto 16px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
      }

      .result__icon.ok {
        background: rgba(63, 185, 80, 0.14);
        color: var(--ok);
      }

      .result__icon.err {
        background: rgba(248, 81, 73, 0.14);
        color: var(--err);
      }

      .result h2 {
        margin: 0 0 8px;
        font-size: 17px;
        font-weight: 600;
      }

      .result p {
        margin: 0;
        font-size: 13px;
        color: var(--fg-muted);
        line-height: 1.7;
        word-break: break-all;
      }

      /* ---- 底部按钮栏 ---- */
      .footer {
        flex: 0 0 auto;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 14px 28px;
        border-top: 1px solid var(--border);
        background: #0b0f14;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="hero">
        <div class="logo">
          <!-- 白色几何 C，和应用图标一致；用 SVG 保证任何缩放下都清晰 -->
          <svg width="30" height="30" viewBox="0 0 100 100">
            <path
              d="M 50 14 A 36 36 0 1 0 50 86 A 36 36 0 1 0 50 14 Z M 50 34 A 16 16 0 1 1 50 66 A 16 16 0 1 1 50 34 Z"
              fill="#fff"
              fill-rule="evenodd"
            />
            <rect x="50" y="42" width="46" height="16" fill="none" />
          </svg>
        </div>
        <div>
          <h1 id="title">CV Studio</h1>
          <p>Windows 下的 STM32 / CMake 工程配置与调试文件生成器</p>
        </div>
        <span class="ver" id="ver">v—</span>
      </div>

      <div class="body">
        <!-- 表单区 -->
        <div id="form">
          <div class="step">
            <div class="step__label">安装位置</div>
            <div class="row">
              <input type="text" id="dir" spellcheck="false" />
              <button id="pick">浏览…</button>
            </div>
          </div>

          <div class="step">
            <div class="step__label">快捷方式</div>
            <div class="checks">
              <label class="check">
                <input type="checkbox" id="desktop" checked />
                创建桌面快捷方式
              </label>
              <label class="check">
                <input type="checkbox" id="startmenu" checked />
                创建开始菜单快捷方式
              </label>
            </div>
          </div>
        </div>

        <!-- 进度区 -->
        <div class="progress-wrap" id="progress">
          <div class="progress-info">
            <span id="stage">准备中</span>
            <span id="pct">0%</span>
          </div>
          <div class="bar"><div class="bar__fill" id="fill"></div></div>
          <div class="progress-info">
            <span id="count"></span>
            <span id="bytes"></span>
          </div>
          <div class="current-file" id="current"></div>
        </div>

        <!-- 结果区 -->
        <div class="result" id="result">
          <div class="result__icon ok" id="resIcon">✓</div>
          <h2 id="resTitle"></h2>
          <p id="resText"></p>
        </div>
      </div>

      <div class="footer">
        <button id="cancel">取消</button>
        <button id="action" class="primary">开始安装</button>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id)
      const api = window.installer

      let defaults = null
      let state = 'idle' // idle | installing | done | failed
      let installedExe = null

      function fmtBytes(n) {
        if (n < 1024) return n + ' B'
        if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB'
        if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB'
        return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB'
      }

      function setBar(percent, indeterminate) {
        const fill = $('fill')
        if (indeterminate) {
          fill.classList.add('indet')
        } else {
          fill.classList.remove('indet')
          fill.style.width = Math.min(100, Math.max(0, percent)) + '%'
        }
      }

      api.onProgress((p) => {
        $('stage').textContent = p.stage
        $('pct').textContent = p.percent + '%'
        setBar(p.percent, p.stage === '清理旧版本' || p.stage === '准备中')
        if (p.total > 0) {
          $('count').textContent = p.done + ' / ' + p.total + ' 个文件'
          $('bytes').textContent = fmtBytes(p.bytesDone) + ' / ' + fmtBytes(p.bytesTotal)
        }
        if (p.current) $('current').textContent = p.current
      })

      async function init() {
        defaults = await api.defaults()
        $('title').textContent = defaults.productName
        $('ver').textContent = 'v' + defaults.version
        $('dir').value = defaults.dir
        document.title = '安装 ' + defaults.productName
      }

      $('pick').addEventListener('click', async () => {
        const d = await api.pickDir()
        if (d) $('dir').value = d
      })

      $('cancel').addEventListener('click', () => {
        if (state === 'installing') return
        api.quit()
      })

      $('action').addEventListener('click', async () => {
        if (state === 'done') {
          if (installedExe) api.launch(installedExe)
          else api.quit()
          return
        }
        if (state === 'failed') {
          location.reload()
          return
        }
        if (state === 'installing') return

        const dir = $('dir').value.trim()
        if (!dir) {
          $('dir').focus()
          return
        }

        state = 'installing'
        $('form').style.display = 'none'
        $('progress').classList.add('on')
        $('action').disabled = true
        $('action').textContent = '正在安装…'
        $('cancel').style.display = 'none'

        const r = await api.install({
          dir,
          desktopShortcut: $('desktop').checked,
          startMenuShortcut: $('startmenu').checked
        })

        $('progress').classList.remove('on')
        $('result').classList.add('on')
        $('action').disabled = false
        $('cancel').style.display = ''

        if (r.ok) {
          state = 'done'
          installedExe = r.exe
          $('resIcon').className = 'result__icon ok'
          $('resIcon').textContent = '✓'
          $('resTitle').textContent = '安装完成'
          $('resText').textContent =
            '已安装到 ' + r.dir + '（用时 ' + r.seconds + ' 秒）'
          $('action').textContent = '立即运行'
          $('cancel').textContent = '关闭'
        } else {
          state = 'failed'
          $('resIcon').className = 'result__icon err'
          $('resIcon').textContent = '✕'
          $('resTitle').textContent = '安装失败'
          $('resText').textContent = r.error || '未知错误'
          $('action').textContent = '重试'
          $('cancel').textContent = '关闭'
        }
      })

      init()
    </script>
  </body>
</html>
