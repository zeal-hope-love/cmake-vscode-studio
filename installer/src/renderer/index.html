<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>CV Studio 安装程序</title>
    <style>
      /* ---------------------------------------------------------------------
         极简单列布局（对齐 DeepSeek Harness 安装器的观感）：

           纯白底 · 单一黑色强调色 · 大留白 · 内容垂直居中的一列

         整页只有四个元素：圆形标志 → 字标 → 一行可点开的文字 → 黑色胶囊按钮。
         没有卡片、没有分割线、没有页脚工具栏 —— 安装器只做一件事，
         界面上就不该有第二件事在抢注意力。

         状态切换（展开路径 / 安装进度 / 安装结果）都发生在「那一行文字」的
         位置，标志和按钮位置不动，所以整个过程界面不会跳。
         --------------------------------------------------------------------- */
      :root {
        --bg: #ffffff;
        --fg: #111111;
        --fg-mid: #3a3a3a;
        --fg-soft: #7a7a7a;
        --fg-faint: #b4b4b4;
        --line: #e7e7e7;
        --line-strong: #d5d5d5;
        --hover: #f4f4f4;
        --err: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', system-ui,
          sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        user-select: none;
        cursor: default;
      }

      /* ---- 顶部：只剩最小化 / 关闭两个极轻的图标 ---- */
      .titlebar {
        position: fixed;
        top: 0;
        right: 0;
        display: flex;
        gap: 2px;
        padding: 6px 8px 0 0;
        -webkit-app-region: drag;
        z-index: 10;
      }

      .winbtn {
        width: 34px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #9b9b9b;
        cursor: pointer;
        -webkit-app-region: no-drag;
        transition:
          background 0.12s ease,
          color 0.12s ease;
      }

      .winbtn:hover:not(:disabled) {
        background: var(--hover);
        color: var(--fg);
      }

      .winbtn:disabled {
        opacity: 0.35;
        cursor: default;
      }

      .winbtn svg {
        display: block;
      }

      /* ---- 主体：一列，垂直居中 ---- */
      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /*
         * 上方多留一截：视觉重心压在偏下 40% 的位置，而不是死正中。
         * 死正中会显得整块内容「浮」在半空；参考图的按钮底部离下沿只有一成多，
         * 顶上却留了三成白 —— 这个不对称才是它的呼吸感来源。
         */
        padding: 124px 44px 0;
        -webkit-app-region: drag;
      }

      button,
      input,
      label,
      .slot {
        -webkit-app-region: no-drag;
      }

      /* ---- 标志：透明底的渐变 C，柔和投影 ---- */
      /*
       * 2.0.2 起图标本身是「渐变 C + 透明底」，不再是一整块圆角方块。
       * 所以不能再套圆形裁切和高光 —— 透明的 GIF 边上会多出一圈没有内容的
       * 亮边，看起来像个脏的圆环。改用 drop-shadow：阴影跟着 alpha 走，
       * 贴在 C 的笔画上，才是图标本身的形状。
       */
      .orb {
        width: 104px;
        height: 104px;
        margin: 0 auto 28px;
      }

      .orb img {
        width: 100%;
        height: 100%;
        display: block;
        filter: drop-shadow(0 10px 22px rgba(84, 96, 208, 0.3));
      }

      /* ---- 字标：小写名 + 黑底白字方框 ---- */
      .lockup {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 10px;
      }

      .lockup .mark {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
        color: var(--fg);
      }

      /*
       * 方框要**贴着 cv 的字身**，不能一高一低。
       *
       * 做法：mark 是 32px + line-height 1，行盒底边在基线下 8px（Segoe 的
       * 升部/降部是 3:1）。所以用 align-items: flex-end 让方框底边对齐行盒底，
       * 再用 margin-bottom 把方框压回基线上；高度取 16px = cv 的 x-height，
       * 方框的上下沿就正好压住字母的上下沿。
       *
       * margin-bottom 实测取 6px 而不是 8px —— 光靠字体的升部/降部比例算会差 2px，
       * 这个值是拿放大截图对出来的，别按公式改回去。
       *
       * letter-spacing 会在最后一个字母后多留一段空白，右边看着比左边厚，
       * 用 text-indent 反向补回来。
       */
      .lockup .tag {
        display: flex;
        align-items: center;
        height: 16px;
        margin-bottom: 6px;
        padding: 0 5px 0 7px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-indent: 0.18em;
        line-height: 1;
        text-transform: uppercase;
        color: #fff;
        background: #0a0a0a;
        border-radius: 4px;
      }

      /* ---- 中间那一格：文字 / 路径 / 进度 / 结果都放这里，高度固定 ---- */
      .slot {
        width: 100%;
        min-height: 100px;
        margin: 30px 0 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* 未展开时：就一行可点的字 */
      .pick-text {
        border: 0;
        background: transparent;
        color: var(--fg-mid);
        font-family: inherit;
        font-size: 14.5px;
        padding: 7px 12px;
        border-radius: 8px;
        cursor: pointer;
        transition:
          background 0.13s ease,
          color 0.13s ease;
      }

      .pick-text:hover {
        background: var(--hover);
        color: var(--fg);
      }

      /* 展开后：路径输入 + 选择按钮 */
      .picker {
        display: none;
        width: 100%;
        max-width: 432px;
      }

      .picker.on {
        display: block;
      }

      .pathrow {
        display: flex;
        gap: 8px;
      }

      input[type='text'] {
        flex: 1;
        min-width: 0;
        height: 46px;
        padding: 0 15px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        color: var(--fg);
        font-family: inherit;
        font-size: 13px;
        user-select: text;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      input[type='text']:focus {
        outline: none;
        border-color: #bdbdbd;
        box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
      }

      .sq {
        height: 46px;
        min-width: 76px;
        padding: 0 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        color: var(--fg-mid);
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        transition:
          background 0.13s ease,
          border-color 0.13s ease;
      }

      .sq:hover {
        background: #fafafa;
        border-color: var(--line-strong);
      }

      .opts {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 16px;
        font-size: 12px;
        color: var(--fg-soft);
      }

      .chk {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }

      .chk input {
        width: 13px;
        height: 13px;
        margin: 0;
        accent-color: #111;
        cursor: pointer;
      }

      /* ---- 进度 ---- */
      .progress {
        display: none;
        width: 100%;
        max-width: 432px;
      }

      .progress.on {
        display: block;
      }

      .pline {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 10px;
        font-size: 12.5px;
        color: var(--fg-mid);
      }

      .pline .pct {
        color: var(--fg-faint);
        font-variant-numeric: tabular-nums;
      }

      .bar {
        height: 4px;
        border-radius: 99px;
        background: #ededed;
        overflow: hidden;
      }

      .bar__fill {
        height: 100%;
        width: 0;
        border-radius: 99px;
        background: var(--fg);
        transition: width 0.2s linear;
      }

      .bar__fill.indet {
        width: 30% !important;
        animation: slide 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes slide {
        0% {
          transform: translateX(-105%);
        }
        100% {
          transform: translateX(340%);
        }
      }

      /*
       * 进度只留「阶段 + 百分比 + 一根条」。
       * 早期版本还显示「82 / 128 个文件」「169 MB / 265 MB」和正在复制的文件名 ——
       * 那是给排障看的，安装的时候没人读它，只会让一屏干净的东西变吵。
       */

      /* ---- 结果 ---- */
      .result {
        display: none;
        text-align: center;
        max-width: 430px;
      }

      .result.on {
        display: block;
      }

      .result h2 {
        margin: 0 0 9px;
        font-size: 15px;
        font-weight: 600;
        color: var(--fg);
      }

      .result h2.err {
        color: var(--err);
      }

      .result .detail {
        margin: 0;
        font-size: 12px;
        line-height: 1.75;
        color: var(--fg-soft);
        white-space: pre-wrap;
        word-break: break-all;
        user-select: text;
      }

      /* ---- 唯一的行动按钮：黑色胶囊 ---- */
      .cta {
        height: 52px;
        padding: 0 24px;
        border: 0;
        border-radius: 16px;
        background: #0a0a0a;
        color: #fff;
        font-family: inherit;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.02em;
        cursor: pointer;
        box-shadow: 0 6px 18px -6px rgba(0, 0, 0, 0.35);
        transition:
          background 0.15s ease,
          transform 0.15s cubic-bezier(0.2, 0.8, 0.3, 1),
          box-shadow 0.15s ease;
      }

      .cta:hover:not(:disabled) {
        background: #1f1f1f;
        transform: translateY(-1px);
        box-shadow: 0 12px 26px -8px rgba(0, 0, 0, 0.42);
      }

      .cta:active:not(:disabled) {
        transform: translateY(0) scale(0.985);
      }

      .cta:disabled {
        background: #dcdcdc;
        color: #fff;
        box-shadow: none;
        cursor: default;
      }

      .ver {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 16px;
        text-align: center;
        font-size: 11px;
        color: #cccccc;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="titlebar">
      <button class="winbtn" id="winmin" title="最小化" aria-label="最小化">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <path d="M1 5h8" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" />
        </svg>
      </button>
      <button class="winbtn" id="winclose" title="关闭" aria-label="关闭">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <path
            d="M1.4 1.4l7.2 7.2M8.6 1.4l-7.2 7.2"
            stroke="currentColor"
            stroke-width="1.1"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>

    <main id="app">
      <div class="brand">
        <!--
          用应用的真实图标裁成圆形，不手画 —— 手绘版和真图标差太远（踩过）。
          圆形 + 顶部高光 + 外发光，是这一版视觉的落点。
        -->
        <div class="orb"><img src="icon.png" alt="" /></div>
        <div class="lockup">
          <span class="mark">cv</span>
          <span class="tag">Studio</span>
        </div>
      </div>

      <div class="slot">
        <!-- 默认状态：一行可点的文字 -->
        <button class="pick-text" id="openPicker">选择安装位置</button>

        <!-- 点开后：路径 + 快捷方式选项 -->
        <div class="picker" id="picker">
          <div class="pathrow">
            <input type="text" id="dir" spellcheck="false" />
            <button class="sq" id="pick">选择</button>
          </div>
          <div class="opts">
            <label class="chk"><input type="checkbox" id="desktop" checked /><span>桌面快捷方式</span></label>
            <label class="chk"><input type="checkbox" id="startmenu" checked /><span>开始菜单快捷方式</span></label>
          </div>
        </div>

        <!-- 安装中 -->
        <div class="progress" id="progress">
          <div class="pline">
            <span id="stage">准备中</span>
            <span class="pct" id="pct">0%</span>
          </div>
          <div class="bar"><div class="bar__fill" id="fill"></div></div>
        </div>

        <!-- 结果 -->
        <div class="result" id="result">
          <h2 id="resTitle"></h2>
          <p class="detail" id="resText"></p>
        </div>
      </div>

      <button class="cta" id="action">立即安装</button>

      <div class="ver" id="ver">v—</div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id)

      /*
       * 浏览器里直接打开这个文件时，preload 注入的 api 不存在 ——
       * 给一套假数据，界面照样能看、能点、能走完整流程。
       * 打包后的安装器里 window.installer 一定存在，这段永远不生效。
       */
      function previewApi() {
        let handler = null
        return {
          defaults: async () => ({
            dir: 'C:\\Users\\PoXia\\AppData\\Local\\Programs\\CV Studio',
            version: '2.0.2',
            productName: 'CV Studio',
            payloadFiles: 128
          }),
          pickDir: async () => null,
          onProgress: (h) => {
            handler = h
            return () => {
              handler = null
            }
          },
          install: async (opts) => {
            const push = (p) =>
              handler &&
              handler({
                stage: p.stage,
                percent: p.percent,
                current: p.current,
                done: p.done,
                total: 128,
                bytesDone: (p.percent / 100) * 265 * 1048576,
                bytesTotal: 265 * 1048576
              })
            for (let i = 0; i <= 100; i += 2) {
              push({
                stage: '复制文件',
                percent: i,
                current: 'resources\\app.asar',
                done: Math.round((i / 100) * 128)
              })
              await new Promise((r) => setTimeout(r, 28))
            }
            return { ok: true, dir: opts.dir, exe: 'CV Studio.exe', seconds: 6.2 }
          },
          launch: () => {},
          quit: () => {}
        }
      }

      const api = window.installer || previewApi()

      let state = 'idle'
      let installedExe = null

      api.onProgress((p) => {
        $('stage').textContent = p.stage
        $('pct').textContent = p.percent + '%'
        const fill = $('fill')
        const indet = p.stage === '准备中' || p.stage === '清理旧版本'
        fill.classList.toggle('indet', indet)
        if (!indet) fill.style.width = Math.min(100, Math.max(0, p.percent)) + '%'
      })

      async function init() {
        const d = await api.defaults()
        $('ver').textContent = 'v' + d.version
        $('dir').value = d.dir
        document.title = d.productName + ' 安装程序'
      }

      $('openPicker').addEventListener('click', () => {
        $('openPicker').style.display = 'none'
        $('picker').classList.add('on')
        $('dir').focus()
        $('dir').setSelectionRange($('dir').value.length, $('dir').value.length)
      })

      $('pick').addEventListener('click', async () => {
        const d = await api.pickDir()
        if (d) $('dir').value = d
      })

      // 关窗口 / 最小化。安装进行中不允许关 —— 半截退出会留下残缺目录
      $('winclose').addEventListener('click', () => {
        if (state === 'installing') return
        api.quit()
      })
      $('winmin').addEventListener('click', () => window.installer && api.minimize())

      $('action').addEventListener('click', async () => {
        if (state === 'done') {
          if (installedExe) api.launch(installedExe)
          else api.quit()
          return
        }
        if (state === 'failed') {
          location.reload()
          return
        }
        if (state === 'installing') return

        /*
         * 点「立即安装」就直接装，不再弹别的东西。
         * 装到哪儿由输入框决定 —— 默认值 init() 里就填好了，
         * 用户没动过就是默认目录。要看/改路径才去点上面那行「选择安装位置」。
         */
        const dir = $('dir').value.trim()
        if (!dir) {
          $('openPicker').click()
          $('dir').focus()
          return
        }

        state = 'installing'
        $('picker').style.display = 'none'
        $('progress').classList.add('on')
        $('action').disabled = true
        $('action').textContent = '正在安装'
        $('winclose').disabled = true

        const r = await api.install({
          dir,
          desktopShortcut: $('desktop').checked,
          startMenuShortcut: $('startmenu').checked
        })

        $('progress').classList.remove('on')
        $('action').disabled = false
        $('winclose').disabled = false

        // 用户自己点了「取消安装」不是出错，退回表单
        if (r.cancelled) {
          state = 'idle'
          $('picker').classList.remove('on')
          $('picker').style.display = ''
          $('openPicker').style.display = ''
          $('action').textContent = '立即安装'
          return
        }

        $('result').classList.add('on')

        if (r.ok) {
          state = 'done'
          installedExe = r.exe
          $('resTitle').className = ''
          $('resTitle').textContent = '安装完成'
          $('resText').textContent = r.dir + '\n用时 ' + r.seconds + ' 秒'
          $('action').textContent = '立即运行'
        } else {
          state = 'failed'
          $('resTitle').className = 'err'
          $('resTitle').textContent = '安装失败'
          $('resText').textContent = r.error || '未知错误'
          $('action').textContent = '重试'
        }
      })

      init()
    </script>
  </body>
</html>
