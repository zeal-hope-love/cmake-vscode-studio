# CMake / VSCode 工程配置器 —— 打包配置
# 文档：docs/DEVELOPMENT.md（含签名方案与版本管理）

# exe 的版本资源是这样来的：
#   产品名称 / 可执行文件名  ← productName
#   文件版本 / 产品版本      ← package.json 的 version
#   文件说明                ← package.json 的 description
#   公司名称 / 版权          ← package.json 的 author / 这里的 copyright
# 改完 version 必须重新打包才会生效。应用内看版本：右上角「?」→ 最后一步「关于与版本」。

appId: com.poxia.cmake-vscode-studio
productName: CMake-VSCode-Configurator
copyright: Copyright © 2026 PoXia

directories:
  buildResources: resources
  output: release

# 只把构建产物和 package.json 打进 asar，源码/文档/工具链都不进
files:
  - out/**/*
  - package.json

# 窗口图标要在运行时读，所以复制到 resources/ 根下（asar 外面）。
# 打包后主进程从 process.resourcesPath/icon.png 取。
extraResources:
  - from: resources/icon.png
    to: icon.png
  # 模块包（vofa 等）：运行时读，所以在 asar 外面。
  # 主进程按 app.isPackaged 决定从 process.resourcesPath/packs 还是 <repo>/packs 读。
  - from: packs
    to: packs

win:
  target:
    - target: nsis
      arch: [x64]
    # 绿色版单文件：自解压到 %TEMP% 再运行，不写注册表
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  # 应用图标：exe、任务栏、开始菜单、桌面快捷方式都用它。
  # 由 tools/make-icons.py 生成（多尺寸 16/24/32/48/64/128/256，每个尺寸独立渲染）。
  icon: resources/icon.ico

  # ---------------------------------------------------------------------------
  # 代码签名
  #
  # 当前没有配置证书，所以首次运行会看到 SmartScreen「未知发布者」警告。
  # 四种方案的取舍见 docs/DEVELOPMENT.md，这里只放可直接启用的模板。
  #
  # 注意：云签名服务（Azure）和本地 signtool 是**互斥**的，
  #      两个都配的话以 azureSignOptions 为准。
  # ---------------------------------------------------------------------------

  # 方案 A：Azure Trusted Signing（个人/小团队推荐，约 $10/月，无需硬件令牌）
  # 凭据走 DefaultAzureCredential：AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
  # azureSignOptions:
  #   endpoint: https://weu.codesigning.azure.net
  #   codeSigningAccountName: your-signing-account
  #   certificateProfileName: your-profile
  #   publisherName: PoXia

  # 方案 B：证书已装进 Windows 证书存储（EV 证书 + 硬件令牌走这条）
  # signtoolOptions:
  #   certificateSubjectName: "你的公司名称（证书上的『颁发给』）"
  #   publisherName: PoXia
  #   rfc3161TimeStampServer: http://timestamp.digicert.com

  # 方案 C：手里有 .pfx 文件（老证书或自签名；2023 年后正规 CA 不再发这种）
  # 更推荐用 CSC_LINK / CSC_KEY_PASSWORD 环境变量，别把密码写进配置文件
  # signtoolOptions:
  #   certificateFile: C:\path\to\cert.pfx
  #   certificatePassword: ${env.CSC_KEY_PASSWORD}
  #   publisherName: PoXia
  #   rfc3161TimeStampServer: http://timestamp.digicert.com

  # 配好签名后建议打开：没签上就让打包直接失败，避免误发布
  # forceCodeSigning: true

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 快捷方式的文件名。**不能带斜杠** —— `CMake / VSCode 工程配置器` 这种写法
  # Windows 建不出 .lnk（/ 在文件名里非法），结果是桌面和开始菜单里什么都没有，
  # 而且打包时不报错，很难发现。真要显示斜杠只能走 uninstallDisplayName 那种纯显示字符串。
  shortcutName: CMake VSCode 工程配置器
  # 「应用和功能」/「程序和功能」里显示的名字。
  # 只影响显示文字，不影响安装目录和用户数据目录 —— 那两个由 productName 决定，
  # 改了会让老用户丢配置，所以别动 productName。
  uninstallDisplayName: CMake / VSCode 工程配置器
  # 安装器自身的图标（安装包 exe 图标、向导窗口、卸载器）
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  # 向导内页右上角的小图（150x57 BMP）+ 欢迎/完成页左侧的竖图（164x314 BMP）。
  # NSIS 只吃 BMP 且没有透明度，所以页头图是白底 —— 正好和向导的白色页头融为一体。
  # 这两张图由 tools/make-icons.py 生成。
  installerHeader: resources/installerHeader.bmp
  installerSidebar: resources/installerSidebar.bmp
  # 2052 = 简体中文
  language: "2052"

portable:
  artifactName: ${productName}-${version}-portable.${ext}

compression: maximum
asar: true
